<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salmon Arabic</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #131f24;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .section-box {
            background-color: #58cc02;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 0 #45a002;
        }
        .lesson-btn {
            background-color: #2b700c;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>🔥 0 streak</span>
        <span>⚡ 0 XP</span>
    </div>

    <div class="section-box">
        <h3>1-BO'LIM</h3>
        <h2>Harflar (ابتيو)</h2>
        <p>0/8 dars tugatildi</p>
    </div>

    <button class="lesson-btn" onclick="startLesson()">1-DARS: Alif</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function startLesson() {
            alert("Tabriklayman! Dars ochildi.");
        }
    </script>

</body>
</html>
